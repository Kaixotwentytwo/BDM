<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../style/basic.css">
    <link rel="stylesheet" href="../style/reg.css">
    <link rel="stylesheet" href="../style/variables.css">
    <template id="login-title-ru">
        <title>Авторизация аккаунта</title>
    </template>
    <template id="login-title-en">
        <title>Account Registration</title>
    </template>
</head>

    <body bgcolor="font" class="themed">
        <button class="absolute okT transparentButton" id="backGuestButton" color="acnt" onclick="navigateTo(event, 'landing.html')">Вернуться на главную</button>

        <header class="flex row bigT pmm gap2 themed themed-ind" style="--lt-color: #dfdfdf;">
            <div class="logoHitbox">
                <div class="logo flex row gap05" id="feed-logo">Feed</div>
            </div>
            <div class="logoHitbox">
                <div class="logo flex row gap05" id="random-logo">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                        <path fill="currentColor"
                            d="M48,366.92,240,480V284L48,170ZM192,288c8.84,0,16,10.75,16,24s-7.16,24-16,24-16-10.75-16-24S183.16,288,192,288ZM96,320c8.84,0,16,10.75,16,24s-7.16,24-16,24-16-10.75-16-24S87.16,320,96,320Z" />
                        <path fill="currentColor"
                            d="M272,284V480L464,366.92V170Zm48,140c-8.84,0-16-10.75-16-24s7.16-24,16-24,16,10.75,16,24S328.84,424,320,424Zm0-88c-8.84,0-16-10.75-16-24s7.16-24,16-24,16,10.75,16,24S328.84,336,320,336Zm96,32c-8.84,0-16-10.75-16-24s7.16-24,16-24,16,10.75,16,24S424.84,368,416,368Zm0-88c-8.84,0-16-10.75-16-24s7.16-24,16-24,16,10.75,16,24S424.84,280,416,280Zm32,77.64h0Z" />
                        <path fill="currentColor"
                            d="M256,32,64,144,256,256,448,144Zm0,120c-13.25,0-24-7.16-24-16s10.75-16,24-16,24,7.16,24,16S269.25,152,256,152Z" />
                    </svg>
                    <label for="">Random</label>
                </div>
            </div>
            <div class="logoHitbox">
                <div class="logo flex row gap05" id="search-logo">
                    <svg viewBox="-8 16 128 128" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
                        <path fill="currentColor" d="M75,106.6c-10.6,0-20.6-4.1-28.1-11.6S35.3,77.5,35.3,66.9c0-10.6,4.1-20.6,11.6-28.1c7.5-7.5,17.5-11.6,28.1-11.6  c10.6,0,20.6,4.1,28.1,11.6c15.5,15.5,15.5,40.7,0,56.2C95.6,102.5,85.6,106.6,75,106.6L75,106.6z M75,38.8  c-7.5,0-14.6,2.9-19.9,8.2c-11,11-11,28.8,0,39.8C60.4,92.1,67.5,95,75,95c7.5,0,14.6-2.9,19.9-8.2c5.3-5.3,8.2-12.4,8.2-19.9  c0-7.5-2.9-14.6-8.2-19.9C89.6,41.7,82.5,38.8,75,38.8L75,38.8z M7.6,123.4l29.8-29.8c1.5,2.1,3.2,4.1,5,5.9c1.8,1.8,3.8,3.5,5.9,5  l-29.8,29.8L7.6,123.4L7.6,123.4z" />
                        <rect fill="none" height="139" id="_x3C_Slice_x3E__100_" width="121" />
                    </svg>
                    <label for="">Search</label>
                </div>
            </div>
        </header>

        <div id="wrapper" class="jcc flex">
            <form id="reg-form" action="" method="post" class="themed">

                <div class="form-header">
                    <h1>Авторизация </h1>
                    <p class="subtitle">Создайте новый аккаунт</p>
                </div>

                <div class="form-group">
                    <span class="group-label">Способ регистрации</span>
                    <div id="radios" class="radio-group">

                        <label class="radio-card" for="email">
                            <input type="radio" name="reg-choose" id="email" value="email" checked>
                            <span class="radio-mark"></span>
                            <span class="radio-text">Email</span>
                            <svg class="radio-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="2" y="4" width="20" height="16" rx="2"/>
                                <path d="m22 7-10 5L2 7"/>
                            </svg>
                        </label>

                        <label class="radio-card" for="login">
                            <input type="radio" name="reg-choose" id="login" value="login">
                            <span class="radio-mark"></span>
                            <span class="radio-text">Логин</span>
                            <svg class="radio-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                        </label>

                        <label class="radio-card" for="phone">
                            <input type="radio" name="reg-choose" id="phone" value="phone">
                            <span class="radio-mark"></span>
                            <span class="radio-text">Телефон</span>
                            <svg class="radio-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="5" y="2" width="14" height="20" rx="2"/>
                                <path d="M12 18h.01"/>
                            </svg>
                        </label>

                    </div>
                </div>

                <div id="logins" class="form-group">

                    <div id="template-phone" class="input-wrap" hidden>
                        <input type="tel" autocomplete="mobile" id="phone-input" name="phone" placeholder="">
                        <label for="phone-input">Номер телефона</label>
                    </div>

                    <div id="template-email" class="input-wrap">
                        <input type="email" autocomplete="email" name="email" id="email-input" placeholder="">
                        <label for="email-input">Адрес электронной почты</label>
                    </div>

                    <div id="template-nickname" class="input-wrap" hidden>
                        <input type="text" autocomplete="nickname" name="nickname" id="nickname-input" placeholder="">
                        <label for="nickname-input">Логин</label>
                    </div>

                </div>

                <hr>

                <div id="passwords" class="form-group">

                    <div class="input-wrap password-wrap">
                        <input autocomplete="new-password" class="password" maxlength="64" type="password" name="new-password" id="password" placeholder=" " required>
                        <label for="password">Пароль</label>
                        <button type="button" class="toggle-pass" id="toggle-pass" aria-label="Показать пароль" state="false">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>

                    <div class="input-wrap password-wrap">
                        <input autocomplete="new-password" class="password" maxlength="64" type="password" name="new-password2" id="password2" placeholder=" " required>
                        <label for="password2">Подтвердите пароль</label>
                        <button type="button" class="toggle-pass" id="toggle-pass2" aria-label="Показать пароль" state="false">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>

                </div>

                <button type="submit" class="submit-btn">
                    <span>Зарегистрироваться</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </button>

                <div id="haveAccWrapper" class="flex jcc">
                    <button class="flex okT jcc transparentButton" color="acnt" onclick="navigateTo(event, 'login.html')">Уже есть аккаунт?</button>
                </div>

            </form>
        </div>
    </body>
</html>
